[package]
name = "vino-chimera"
version = "0.0.1"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Userspace DL3 control, authentication, codec, and USB service using the stock EVDI display ABI."

[lib]
path = "src/lib.rs"

[dependencies]
# The ONLY crypto deps: AES block cipher, SHA-256, HMAC-SHA256, and raw RSA
# modexp (for hdcp.rs's OAEP km-wrap). AES-CTR and AES-CMAC ("Dl3Cmac") are
# built on the AES primitive inside the kernel-prelude shim, so the kernel
# cp.rs AES-CTR/CMAC math runs verbatim with no extra third-party MAC crate.
aes = "0.8"
sha2 = "0.10"
hmac = "0.12"
num-bigint = "0.4"
getrandom = "0.2"
libc = "0.2"
# A crate literally named `kernel` so `ake.rs`'s nested `id` submodule's bare
# `use kernel::bindings;` resolves via the extern prelude, exactly like the
# real kernel crate does there (see `kernel-shim`'s own doc comment).
kernel = { package = "kernel-shim", path = "../kernel-shim" }

[features]
# `live` pulls in the USB transport (rusb via vino-driver) for the hardware
# coldstart binary. Off by default so the offline proof builds with zero USB deps.
live = ["dep:vino-driver"]

[dependencies.vino-driver]
path = "../vino-driver"
optional = true

[[bin]]
name = "chimera-prove"
path = "src/bin/prove.rs"

[[bin]]
name = "chimera"
path = "src/bin/daemon.rs"
required-features = ["live"]

[[bin]]
name = "chimera-shared-ake-probe"
path = "src/bin/shared_ake_probe.rs"
required-features = ["live"]

[[bin]]
name = "chimera-per-head-probe"
path = "src/bin/per_head_probe.rs"
required-features = ["live"]

[[bin]]
name = "chimera-mode-probe"
path = "src/bin/mode_probe.rs"
required-features = ["live"]

[[bin]]
name = "chimera-video-arm-probe"
path = "src/bin/video_arm_probe.rs"
required-features = ["live"]

[[bin]]
name = "chimera-first-frame-probe"
path = "src/bin/first_frame_probe.rs"
required-features = ["live"]

[[bin]]
name = "chimera-evdi-open-probe"
path = "src/bin/evdi_open_probe.rs"
required-features = ["live"]

[[bin]]
name = "chimera-edid-probe"
path = "src/bin/edid_probe.rs"
required-features = ["live"]
