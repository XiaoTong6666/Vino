[package]
name = "vino-driver"
version = "0.0.1"
edition = "2021"
license = "GPL-2.0-or-later"
description = "DisplayLink DL3 userspace USB transport"

# rusb owns the safe USB API; `usb.rs` contains the small raw libusb boundary
# needed for pipelined asynchronous transfers.
[dependencies]
rusb = "0.9.4"
libc = "0.2"
